<!-- Survey CTA Box -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#f2f2f2; border-radius:5px;">
  <tr>
    <td style="padding:24px 28px; font-family:Arial, Helvetica, sans-serif;">

      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
        <tr>
          <!-- Text + Click Icon -->
          <td valign="middle" style="padding-right:20px; font-family:Arial, Helvetica, sans-serif;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td valign="middle" style="font-family:Arial, Helvetica, sans-serif;">
                  <p style="margin:0; padding:0; font-family:Arial, Helvetica, sans-serif; font-size:18px; line-height:1.4; font-weight:bold; color:#000000;">
                    Fill out the survey to <span style="color:#0362de;">schedule your session!</span>
                  </p>
                </td>
                <td valign="middle" width="36" style="width:36px; padding-left:10px;">
                  <img src="https://mcusercontent.com/db36ab0999d3be4f3a4223279/images/a8728fea-02d8-e4d1-1c3d-4662b324a6bd.jpg" alt="" width="28" style="display:block; width:28px; max-width:28px; height:auto; border:0;">
                </td>
              </tr>
            </table>
          </td>

          <!-- Vertical Divider -->
          <td valign="middle" align="center" width="12" style="width:12px; padding:0; font-size:0; line-height:0;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="1" style="width:1px;">
              <tr>
                <td height="50" style="width:1px; height:50px; background-color:#d9d9d9; font-size:0; line-height:0;">&nbsp;</td>
              </tr>
            </table>
          </td>

          <!-- Button (single CTA) -->
          <td valign="middle" align="right" width="220" style="width:220px; padding-left:10px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="right">
              <tr>
                <td align="center" bgcolor="#0362de" style="background-color:#0362de; border-radius:6px;">
                  <a href="https://forms.gle/PEPTyzYUeaAiE3VT8" target="_blank" style="display:inline-block; padding:14px 18px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.2; font-weight:bold; color:#ffffff; text-decoration:none; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap;">
                    Schedule My Session&nbsp;&rarr;
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
