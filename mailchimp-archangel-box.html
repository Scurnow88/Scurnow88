<!-- Why Schools Choose Archangel — logo | divider | text, stacks on mobile -->
<style type="text/css">
  body, table, td, p, a, h1, h2, h3 {
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  table { border-collapse: collapse; }
  img { display: block; height: auto; border: 0; outline: none; text-decoration: none; }

  @media only screen and (max-width: 620px) {
    .conference-shell {
      width: 100% !important;
      max-width: 100% !important;
    }
    .mobile-padding {
      padding-left: 16px !important;
      padding-right: 16px !important;
    }
    .arch-white-wrap {
      width: 100% !important;
      max-width: 100% !important;
    }
    .arch-gray-inner {
      padding: 16px !important;
    }
    .arch-logo {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      text-align: center !important;
      padding: 0 0 12px 0 !important;
    }
    .arch-div {
      display: none !important;
      width: 0 !important;
      max-height: 0 !important;
      overflow: hidden !important;
      mso-hide: all !important;
    }
    .arch-text {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      padding-left: 0 !important;
      box-sizing: border-box !important;
    }
    .arch-title {
      font-size: 17px !important;
      line-height: 1.3 !important;
      text-align: center !important;
    }
    .arch-body {
      font-size: 14px !important;
      line-height: 1.5 !important;
      text-align: center !important;
    }
  }
</style>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="conference-shell" style="width:100%; max-width:640px; margin:0 auto; background-color:#ffffff; border-collapse:collapse; font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif;">
  <tbody>
    <tr>
      <td class="mobile-padding" style="padding:0 40px 24px 40px;">

        <!-- White border wrapper (nested — avoids mobile overflow from border width) -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="arch-white-wrap" style="width:100%; background-color:#ffffff; border-collapse:collapse;">
          <tbody>
            <tr>
              <td style="padding:3px; background-color:#ffffff;">

                <!-- Gray box -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="arch-gray-inner" style="width:100%; background-color:#f2f2f2; border-radius:8px; border-collapse:collapse;">
                  <tbody>
                    <tr>
                      <td style="padding:18px 16px;">

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
                          <tbody>
                            <tr>
                              <!-- Logo -->
                              <td class="arch-logo" valign="middle" width="64" style="width:64px; padding-right:14px; text-align:center;">
                                <img src="https://mcusercontent.com/db36ab0999d3be4f3a4223279/images/42785579-57e7-1dab-2d73-73efc65d4612.png" width="48" alt="Archangel logo" style="width:48px; max-width:48px; height:auto; margin:0 auto;">
                              </td>

                              <!-- Vertical divider -->
                              <td class="arch-div" valign="middle" width="16" style="width:16px; padding:0; font-size:0; line-height:0;">
                                <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="16" style="width:16px;">
                                  <tr>
                                    <td width="7" style="width:7px; font-size:0; line-height:0;">&nbsp;</td>
                                    <td valign="middle" width="1" bgcolor="#d9d9d9" style="width:1px; background-color:#d9d9d9; font-size:0; line-height:0;">
                                      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="1" style="width:1px;">
                                        <tr>
                                          <td height="70" style="width:1px; height:70px; background-color:#d9d9d9; font-size:0; line-height:0;">&nbsp;</td>
                                        </tr>
                                      </table>
                                    </td>
                                    <td width="7" style="width:7px; font-size:0; line-height:0;">&nbsp;</td>
                                  </tr>
                                </table>
                              </td>

                              <!-- Title + body -->
                              <td class="arch-text" valign="middle" style="padding-left:14px; font-family:Arial, Helvetica, sans-serif;">
                                <h2 class="arch-title" style="margin:0 0 8px 0; color:#000000; font-size:18px; line-height:1.3; font-weight:700;">
                                  Why Schools Choose <span style="color:#0362de;">Archangel</span>
                                </h2>
                                <p class="arch-body" style="margin:0; color:#000000; font-size:14px; line-height:1.5; font-weight:400; overflow-wrap:anywhere; word-break:break-word;">
                                  We help schools create practical, <span style="color:#0362de;">student-centered solutions</span> teachers can use right away.
                                </p>
                              </td>
                            </tr>
                          </tbody>
                        </table>

                      </td>
                    </tr>
                  </tbody>
                </table>

              </td>
            </tr>
          </tbody>
        </table>

      </td>
    </tr>
  </tbody>
</table>
